spring.application.name=weather-api
weather.api.url=https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline
weather.api.key=${WEATHER_API_KEY}

resilience4j.ratelimiter.instances.apiweather.limitForPeriod=5
resilience4j.ratelimiter.instances.apiweather.limitRefreshPeriod=30s
resilience4j.ratelimiter.instances.apiweather.timeoutDuration=0

spring.data.redis.port=6379
spring.data.redis.host=localhost
spring.data.redis.password={PASSWORD_REDIS


spring.cache.redis.time-to-live=60000

spring.datasource.url=jdbc:postgresql://localhost:5432/cacheweather
spring.datasource.username=postgres
spring.datasource.password={PASSWORD_PG}
spring.datasource.driver-class-name=org.postgresql.Driver